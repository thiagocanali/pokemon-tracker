name: Validate application

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test catalog sync validation
        run: deno test --allow-net supabase/functions/sync-pokemon-catalog/validation_test.ts supabase/functions/cache-tests/freshness_test.ts supabase/functions/cache-tests/stale_pokemon_fallback_test.ts supabase/functions/cache-tests/provenance_test.ts
